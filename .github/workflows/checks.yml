name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with isolated PostgreSQL
        run: docker compose -p zelta-validation -f compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove test containers
        if: always()
        run: docker compose -p zelta-validation -f compose.test.yml down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build -- --webpack
