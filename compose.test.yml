services:
  api-smoke:
    profiles: [smoke]
    build:
      context: ./backend
    environment:
      POSTGRES_URL: postgresql://zelta_test:test-only@test-db:5432/zelta_test
      SUPABASE_URL: https://project.example.com
      REDIS_URL: redis://test-redis:6379/0
      NEWS_SENTIMENT_ENABLED: "false"
      ENABLE_DIAGNOSTIC_ROUTES: "false"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 20
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zelta_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: zelta_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelta_test -d zelta_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_URL: postgresql://zelta_test:test-only@test-db:5432/zelta_test
      REDIS_URL: redis://test-redis:6379/0
      FINNHUB_API_KEY: ""
      OPENAI_API_KEY: ""
      SUPABASE_URL: ""
      PYTHONPATH: /app
      ZELTA_ISOLATED_TEST: "1"
    volumes:
      - ./backend:/app:ro
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
