services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zelta_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: zelta_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelta_test -d zelta_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_URL: postgresql://zelta_test:test-only@test-db:5432/zelta_test
      REDIS_URL: redis://localhost:6379/0
      FINNHUB_API_KEY: ""
      OPENAI_API_KEY: ""
      SUPABASE_URL: ""
      PYTHONPATH: /app
    volumes:
      - ./backend:/app:ro
    depends_on:
      test-db:
        condition: service_healthy
